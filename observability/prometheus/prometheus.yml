global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    application: orderflow

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: orderflow
    static_configs:
      - targets: [otel-collector:9464]

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
