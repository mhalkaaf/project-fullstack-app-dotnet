global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    application: orderflow

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: orderflow-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:3000]

  - job_name: orderflow-worker
    metrics_path: /metrics
    static_configs:
      - targets: [worker:3001]

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
